name: Agent Run

on:
  repository_dispatch:
    types: [agent-run]
  workflow_dispatch:
    inputs:
      prompt:
        description: Free-form task prompt for the agent
        required: true
        type: string
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        type: string
        default: "20"
      max_concurrent:
        description: Max simultaneous runs (concurrency bucket count)
        required: false
        type: string
        default: "10"
      runner:
        description: Runner label for the run job
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  bucket:
    runs-on: ubuntu-latest
    outputs:
      group: ${{ steps.calc.outputs.group }}
    steps:
      - id: calc
        env:
          MAX_CONCURRENT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.max_concurrent) || '10' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bucket=$(( RUN_ID % MAX_CONCURRENT ))
          echo "group=agent-run-${bucket}" >> "$GITHUB_OUTPUT"

  run:
    needs: bucket
    concurrency:
      group: ${{ needs.bucket.outputs.group }}
      cancel-in-progress: false
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.timeout_minutes) || '20') }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.REPO_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 1
          submodules: false

      - name: Configure git identity
        run: |
          git config --global user.name "agent-runner[bot]"
          git config --global user.email "agent-runner[bot]@users.noreply.github.com"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run agent
        id: run
        env:
          TASK_PROMPT: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.prompt }}
        run: |
          claude -p "$TASK_PROMPT" --dangerously-skip-permissions | tee "$RUNNER_TEMP/agent_output.log" || true
          claude_status="${PIPESTATUS[0]}"
          outcome=$(grep -o 'AGENT_OUTCOME: [A-Za-z_]*' "$RUNNER_TEMP/agent_output.log" | tail -1 | cut -d' ' -f2)
          echo "claude_status=${claude_status}" >> "$GITHUB_OUTPUT"
          echo "outcome=${outcome}" >> "$GITHUB_OUTPUT"

      - name: Update issue labels
        if: always() && github.event_name == 'repository_dispatch'
        env:
          REPO: ajorquera/new
          PHASE: ${{ github.event.client_payload.phase }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          CLAUDE_STATUS: ${{ steps.run.outputs.claude_status }}
          OUTCOME: ${{ steps.run.outputs.outcome }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:in-progress

          if [ "$CLAUDE_STATUS" != "0" ] || [ -z "$OUTCOME" ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label agent:needs-human
            exit 0
          fi

          case "${PHASE}:${OUTCOME}" in
            explore:READY)                    gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:explore    --add-label agent:design ;;
            explore:BLOCKED)                  gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:explore    --add-label agent:needs-human ;;
            design:READY)                      gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:design     --add-label agent:implement ;;
            design:BLOCKED)                    gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:design     --add-label agent:needs-human ;;
            implement:READY)                   gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:implement  --add-label agent:review ;;
            implement:BLOCKED)                 gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:implement  --add-label agent:needs-human ;;
            review:APPROVED)                   : ;;
            review:CHANGES_REQUESTED)          gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:review     --add-label agent:implement ;;
            review:CHANGES_REQUESTED_CAPPED)   gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label agent:review     --add-label agent:needs-human ;;
            *)                                 gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --add-label agent:needs-human ;;
          esac
