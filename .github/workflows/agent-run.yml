name: Agent Run

on:
  repository_dispatch:
    types: [agent-run]
  workflow_dispatch:
    inputs:
      prompt:
        description: Free-form task prompt for the agent
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ secrets.REPO_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 1
          submodules: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run agent
        env:
          TASK_PROMPT: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.prompt }}
        run: |
          claude -p "$TASK_PROMPT" --bare --dangerously-skip-permissions
