name: Agent Run

on:
  repository_dispatch:
    types: [agent-run]
  workflow_dispatch:
    inputs:
      prompt:
        description: Free-form task prompt for the agent
        required: true
        type: string
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        type: string
        default: "20"
      max_concurrent:
        description: Max simultaneous runs (concurrency bucket count)
        required: false
        type: string
        default: "10"
      runner:
        description: Runner label for the run job
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  bucket:
    runs-on: ubuntu-latest
    outputs:
      group: ${{ steps.calc.outputs.group }}
    steps:
      - id: calc
        env:
          MAX_CONCURRENT: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.max_concurrent) || '10' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          bucket=$(( RUN_ID % MAX_CONCURRENT ))
          echo "group=agent-run-${bucket}" >> "$GITHUB_OUTPUT"

  run:
    needs: bucket
    concurrency:
      group: ${{ needs.bucket.outputs.group }}
      cancel-in-progress: false
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.runner) || 'ubuntu-latest' }}
    timeout-minutes: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.timeout_minutes) || '20') }}
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.REPO_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_PAT }}
          fetch-depth: 1
          submodules: false

      - name: Configure git identity
        run: |
          git config --global user.name "agent-runner[bot]"
          git config --global user.email "agent-runner[bot]@users.noreply.github.com"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run agent
        env:
          TASK_PROMPT: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || github.event.inputs.prompt }}
        run: |
          set -o pipefail
          claude -p "$TASK_PROMPT" --dangerously-skip-permissions | tee "$RUNNER_TEMP/agent_output.log"

      - name: Report outcome
        if: always() && github.event_name == 'repository_dispatch' && github.event.client_payload.callback_repo != '' && github.event.client_payload.callback_event_type != ''
        env:
          CALLBACK_REPO: ${{ github.event.client_payload.callback_repo }}
          CALLBACK_EVENT_TYPE: ${{ github.event.client_payload.callback_event_type }}
          CALLBACK_PAYLOAD: ${{ github.event.client_payload.callback_payload }}
        run: |
          outcome=$(grep -oE 'AGENT_OUTCOME:[[:space:]]*[A-Z_]+' "$RUNNER_TEMP/agent_output.log" | tail -1 | sed -E 's/AGENT_OUTCOME:[[:space:]]*//')
          target=$(grep -oE 'AGENT_COMMENT_TARGET:[[:space:]]*(issue|pr) #[0-9]+' "$RUNNER_TEMP/agent_output.log" | tail -1)
          target_type=$(sed -E 's/AGENT_COMMENT_TARGET:[[:space:]]*(issue|pr) #[0-9]+/\1/' <<<"$target")
          target_number=$(sed -E 's/AGENT_COMMENT_TARGET:[[:space:]]*(issue|pr) #([0-9]+)/\2/' <<<"$target")
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh api "repos/${CALLBACK_REPO}/dispatches" \
            --method POST \
            -f event_type="$CALLBACK_EVENT_TYPE" \
            -f "client_payload[outcome]=${outcome}" \
            -f "client_payload[run_url]=${run_url}" \
            -f "client_payload[comment_target_type]=${target_type}" \
            -f "client_payload[comment_target_number]=${target_number}" \
            -f "client_payload[callback_payload]=${CALLBACK_PAYLOAD}"
